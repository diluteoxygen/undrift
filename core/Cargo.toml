[package]
name = "undrift-core"
version = "0.1.0"
edition = "2024"
authors = ["Vikrant Singh <vikrantsinghtomar011@gmail.com>"]
description = "High-performance disk space reclaiming engine with MFT scanning and dev-aware safety checks"
license = "MIT"

[lib]
name = "undrift_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "undrift"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.21", default-features = false }
trash = "5.2"
walkdir = "2.5"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_RestartManager",
] }
ntfs-reader = "0.4.6"

[dev-dependencies]
tempfile = "3.17"

[[bench]]
name = "scan_benchmark"
harness = false
