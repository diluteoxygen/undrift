name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Core Engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --verbose

  rust-windows:
    name: Core Engine & WinUI 3 (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy on Windows (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests on Windows
        run: cargo test --all-targets --verbose

      - name: Build Rust Core Release Binary & Library
        run: cargo build --release

      - name: Restore .NET packages
        run: dotnet restore app/Sweepie.App.sln

      - name: Build WinUI 3 Application
        run: dotnet build app/Sweepie.App/Sweepie.App.csproj --configuration Release --no-restore
